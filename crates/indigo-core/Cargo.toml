[package]
name = "indigo-core"
license = "MPL-2.0"
edition = "2024"

[features]
arbitrary = ["dep:arbitrary", "indigo-key/arbitrary"]
language-rust = ["dep:tree-sitter-rust"]

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true }
bpaf = { workspace = true }
camino = { workspace = true }
indigo-key = { workspace = true }
indigo-text = { workspace = true }
indigo-wrap = { workspace = true }
pathdiff = { workspace = true }
regex-cursor = { workspace = true }
ropey = { workspace = true }
shell-words = { workspace = true }
slotmap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }
hegeltest = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "syntax_parse"
harness = false
required-features = ["language-rust"]
