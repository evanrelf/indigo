[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
arrayvec = "0.7.8"
bitflags = { version = "2.13.2", features = ["std"] }
bpaf = "0.9.28"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
crop = { version = "0.4.3", features = ["graphemes"] }
diff = "0.1.13"
divan = "0.1.21"
hegeltest = { version = "0.52.0", features = ["static-engine"] }
imbl = "7.0.2"
indigo = { path = "crates/indigo/" }
indigo-cli = { path = "crates/indigo-cli/" }
indigo-core = { path = "crates/indigo-core/" }
indigo-key = { path = "crates/indigo-key/" }
indigo-kernel = { path = "crates/indigo-kernel/" }
indigo-term = { path = "crates/indigo-term/" }
indigo-text = { path = "crates/indigo-text/" }
indigo-wrap = { path = "crates/indigo-wrap/" }
libc = "0.2.191"
log = "0.4.35"
memchr = "2.8.3"
pastey = "0.2.3"
pathdiff = { version = "0.2.3", features = ["camino"] }
ratatui = "0.30.2"
ratatui-core = "0.1.2"
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
roaring = "0.12.0"
ropey = { version = "2.0.0-beta.1" }
shell-words = "1.1.1"
sigpipe = "0.1.3"
slotmap = "1.1.1"
thiserror = "2.0.21"
tinyvec = { version = "1.13.3", features = ["grab_spare_slice", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
winnow = "1.0.5"

[workspace.lints]
cargo.unused_workspace_dependencies = "allow"
clippy.allow_attributes = "warn"
clippy.as_conversions = "deny"
clippy.bool_to_int_with_if = "allow"
clippy.missing_errors_doc = "allow"
clippy.missing_panics_doc = "allow"
clippy.pedantic = { level = "warn", priority = -1 }
clippy.redundant_closure = "allow"
clippy.redundant_closure_for_method_calls = "allow"
clippy.redundant_pub_crate = "warn"
clippy.should_panic_without_expect = "allow"
clippy.use_self = "warn"
rust.unsafe_code = "deny"

[profile.dev.package.hegeltest]
opt-level = 3

[profile.dev.package.hegeltest-c]
opt-level = 3

[profile.profile]
inherits = "release"
debug = "full"
